name: CI

# The nix half, on both platforms, plus the one packaging property this module cannot ship
# without. There is no unit-tests.yml here: the engine is C++ and its behaviour is covered by
# doctests.yml, which drives it through the real runtime against a live stagenet node.


on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment; main jobs must opt into
    # it to publish to the public cache.
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build plugin and package
        # Two attributes because neither contains the other: `lgx` is the plugin plus the
        # packaging step, `default` is the same plugin plus the generated consumer API its
        # dependants compile against. Both rest on one expensive derivation, so the second is
        # nearly free.
        run: nix build -L .#lgx .#default

  payload:
    name: the LGPL library travels with the plugin
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: monero_c is a separate shared library in the payload, not linked into the plugin
        # LGPL-3.0 compliance rests on exactly this: the engine is a SEPARATE shared object a
        # user can replace. `nix build` succeeding proves the link line, not the payload, and
        # the two came apart once already for a module whose library was dlopen'd.
        run: |
          set -euo pipefail
          nix build -L .#install-portable -o result
          ls -l result/modules/monero_wallet_core_module
          # A glob rather than `ls | grep`: the extension is .so / .dylib / .dll by platform.
          set -- result/modules/monero_wallet_core_module/libmonero_wallet2_api_c.*
          [ -e "$1" ] || { echo "::error::the monero_c library is not in the payload"; exit 1; }
          echo "payload carries $(basename "$1")"
